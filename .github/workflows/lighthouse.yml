name: Lighthouse

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lighthouse:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: npx --yes @lhci/cli@0.14.x autorun --collect.staticDistDir=. --collect.url=/index.html --upload.target=temporary-public-storage
